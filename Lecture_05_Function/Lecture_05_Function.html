## 为什么要有函数？

**演示**：Notebook 示例 3.1.1，3.1.2，3.1.3

- 你写了一个 Python 脚本，可以把摄氏度转换为华氏度
- 我想**更方便的传入不同数据**，不需要每次修改源代码
  - 使用**输入输出**
- 我有更复杂的流程，我需要**重复使用**很多次，但是不想复制粘贴很多次
  - 函数就是把一段代码 **“打包”** 起来，方便重复使用

函数就像是一个黑箱，我们不需要知道内部的细节，只需要准备好需要的数据，就能得到想要的结果。

我们之前也做过这样“不用考虑发生了什么，只需要把东西放在指定的位置”的事：`print`, `type`

**演示**：Notebook 示例 3.1.4，3.1.5

<!--v-->

## 函数 (function)

- 为什么要有函数？
  - 数学的函数，一个名字就省去了抄写复杂的定义： $\sin(x), \cos(x), \tan(x)$
  - 编程中，定义一个函数可以**防止重复的代码**（代码复用）
  - 让我们专注在更重要的内容上，**隐藏过于复杂的细节**（代码封装）
- 函数是什么？
  - 一段**有名字的代码**，可以通过那个名字（标识符）找到并开始运行它
  - 通俗理解，函数就是大段代码的 **“替身”**

<!--v-->

## 函数调用（call/invoke）

正确的让函数帮你做事的方法：

      print(   "Hello"   )
        ^  ^      ^      ^
        |  |      |      |
    函数名 左括号   参数    右括号

缺东西，函数不做事：

      print  "Hello"
        ^       ^
        |       |
      函数名     参数

**演示**：Notebook 示例 3.1.6，3.1.7

<!--v-->

## 函数调用（call/invoke）

调用可以没有参数，但是不能没有左右括号。

    print() <- 里面是空的，没有参数
      ^
      |
    函数名

当然有的函数也可以接受很多个参数

      print(   "Hello", "My", "SI100+"   )
        ^  ^      ^         ^            ^
        |  |      |         |            |
    函数名 左括号   参数们   逗号分隔       右括号

**演示**：Notebook 示例 3.1.8

<!--v-->

## 函数调用（call/invoke）

**总结**

- 调用函数必须有
  - 函数名，写在最前面
  - 一对括号，写在函数名后面
- 调用函数可以有
  - 参数
  - 很多个参数

</br>

## 返回值（return value）

高中物理学：

$$
v = \sqrt{\dfrac{g s_1^2}{2 (H - h)}}
$$

- 调用就是“套公式”
- 返回值就是“公式的结果”

```py
v = calculate_that(g, s1, H, h)
```

所以，不写 `v = ...`，等号右侧的部分依然有其值

`t = type(123)`：把变量 `t` 赋值为 `type(123)` 这个函数执行的结果（返回值）

<!--v-->

## 返回值（return value）

- 有的函数主要完成某个操作，而不是计算一个结果，比如 `print`
- Python 函数调用总会产生返回值
- 如果函数没有执行带表达式的 `return`，就会返回 `None`

```py []
result = print("Hello, World!")
print(result)       # None
print(type(result)) # <class 'NoneType'>
```

**演示**：Notebook 示例 3.1.9

<!--v-->

## 内置函数初探

- `max(a, b)`: 返回 `a` 与 `b` 中最大值
- `min(a, b)`: 返回 `a` 与 `b` 中最小值
  - 支持像 `print` 那样，接收许多个参数，如 `max(a, b, c, d)`
- `abs(x)`: 返回 `x` 的绝对值

</br>

上面列出的都是有返回值的函数，阅读文档了解更多内置函数

https://docs.python.org/zh-cn/3/library/functions.html

## 方法 (method)

现实世界中，有的“功能”和某些个体绑定

- 圆能够“求半径”
- 三角形和正方形，不能够“求半径”

</br>

**演示**：Notebook 示例 3.1.10

- 像是某种特殊的函数：`圆.求半径()` $\to$ `"abc".capitalize()`
- 方法区别于函数，它不是 **随处可用** 的，而是 **依赖** 某个特定的字面值/变量
  - 例如，上述例子中，只有 `str` 类型的字面值/变量才能够使用 `.capitalize()`
- 我们并不会在这次课程中涉及到怎么写 **方法**，因为还需要很多面向对象的前置知识

## 代码块（Revisited）

> Python 的特色之一是依据代码行的 **缩进 (indentation)** 确定代码块：

```py []
if 1 + 1 == 2:
    print("basic statement passed!") # 我和 if 语句不在同一个代码块！

a = 10
b = 20
# 上面的两行在同一个代码块
```

<!--v-->

## 定义函数

- 我希望我写的许多行 Python 被打包起来
- 使用缩进！

```py []
# 下面两行没有缩进
celsius = var_in
fahrenheit = celsius * 9 / 5 + 32
```

```py []
# 下面两行有缩进
    celsius = var_in
    fahrenheit = celsius * 9 / 5 + 32
```

<!--v-->

## 定义函数

只是缩进并不能让 Python 理解你写的这部分是一个函数，你需要主动说明。

- 函数的“必须”和“可能”
  - **函数名**，你需要给你的函数起一个名字（复习前面的标识符命名规则）
  - **小括号**，里面装着**参数**

```py []
# 下面两行有缩进，但是没有说明这是函数
    celsius = var_in
    fahrenheit = celsius * 9 / 5 + 32
```

```py []
# 我们从外面拿进来 var_in，即：var_in 是函数的参数
celsius_to_fahrenheit(var_in)
    celsius = var_in
    fahrenheit = celsius * 9 / 5 + 32
```

<!--v-->

## 定义函数

Python 的函数定义格式：

```py []
# 已经非常接近 Python 的函数定义了
celsius_to_fahrenheit(var_in)
    celsius = var_in
    fahrenheit = celsius * 9 / 5 + 32
```

```py []
# 完整的 Python 函数定义
def celsius_to_fahrenheit(var_in): # 注意这里必须有一个冒号
    celsius = var_in
    fahrenheit = celsius * 9 / 5 + 32
```

```py []
# 直接把 celsius 当作参数
def celsius_to_fahrenheit(celsius): # 注意这里必须有一个冒号
    fahrenheit = celsius * 9 / 5 + 32
```

<!--v-->

## 定义函数

```py []
def celsius_to_fahrenheit(celsius):
    fahrenheit = celsius * 9 / 5 + 32
```

- 要定义一个函数，我们会用关键字 `def` 开头，后接函数名称和一对圆括号
- 圆括号里面是**参数** (Parameter)，可以有多个，用逗号分隔
- 圆括号里写下的变量可以直接在函数里面使用，实际的值将由调用时 **真正的参数** 决定
  - 例如 `f(2)` 会自动将 `x` 赋值为 `2`，这样才计算得出了正确的结果
- **一定不要忘记那个冒号！**
  - 冒号相当于告诉 Python 后面的代码块是函数的内容
  - 代码块取决于**缩进**，冒号后面跟的是很多行开头是 4 个空格的代码，同属于一个代码块

<!--v-->

## 返回语句

测试一下我们的函数能不能正常工作

```py []
def celsius_to_fahrenheit(celsius):
    fahrenheit = celsius * 9 / 5 + 32

result = celsius_to_fahrenheit(23)
```

**演示**：Notebook 示例 3.2.1

- 函数没有显式执行 `return`，因此自动返回 `None`
- 该怎么让 Python 知道我们想要返回 `fahrenheit`？

```py []
def celsius_to_fahrenheit(celsius):
    fahrenheit = celsius * 9 / 5 + 32
    return fahrenheit
```

**演示**：Notebook 示例 3.2.2

现代 Python 项目常用可选的类型标注表达输入输出类型，并用 docstring 说明用途：

```py []
def celsius_to_fahrenheit(celsius: float) -> float:
    """Convert Celsius to Fahrenheit."""
    return celsius * 9 / 5 + 32
```

类型标注通常不会在运行时自动检查，但能帮助读者和编辑器理解代码。

`def` 那一行也是没有缩进，在最底层代码块，运行到 `def` 的时候发生了什么？

**演示**：Notebook 示例 3.2.3

```py []
say_my_name("初音未来")

def say_my_name(name):
    print("我去,", name, "!")
```

## 函数定义与执行的顺序

- 执行函数调用时，函数必须已经被定义
  - 执行 `def` 语句会定义函数
- Python 顺序执行
- 因此，在最外层代码块先调用、后定义会触发 `NameError`

- 调用相当于从调用的位置跳到函数体第一行
  - 函数体内依然顺序执行
  - 函数运行到哪里停止？
    - 执行了 `return` 语句 **演示**：Notebook 示例 3.2.4
    - 执行完函数体的最后一行
- 执行完函数体，返回到调用的位置

<!--v-->

## 参数：函数沟通的桥梁

- 需要区分形参 (parameter) 和实参 (argument)
  - 形参：写在函数定义处的名称 `def f(x1, x2): ...`
    - 公式里面的字母们
    - 调用函数时，这些名称会被赋值为传入的值
  - 实参：写在调用处的表达式 `f(1, 2)`
    - 套公式的时候代入的数
    - Python 会先计算实参表达式，再将结果赋值给对应形参

参数把函数外的东西起了别名，带到了函数里面

<!--v-->

## 全局变量和局部变量

- 函数体是一个代码块
- 最外层无缩进的部分也是一个代码块
- 重名了怎么办？

```py []
def celsius_to_fahrenheit(celsius):
    fahrenheit = celsius * 9 / 5 + 32
    return fahrenheit

# 这里也有 celsius 和 fahrenheit，但是代码还是可以运行
celsius = 23
fahrenheit = celsius_to_fahrenheit(celsius)
```

</br>

李华：一个人尽皆知的故事

<!--v-->

## 全局变量和局部变量

- 有人提到“李华”
  - 高考英语卷中的李华
- 如果你身边真的有一个李华同学
  - 你的同学李华

</br>

**全局变量（Global Variable）**：定义在最外层的变量，作用范围为全局

英语卷的李华，所有人（作用域）知道他

**局部变量（Local Variable）**：函数的形参和函数体内绑定的名称，作用范围通常是当前函数。

你的同学李华，只有你们学校（作用域）的人知道他

**作用域（Scope）**：变量的作用范围

> 缩进代码块不一定创建新作用域。`if`、`for` 和 `with` 中绑定的普通名称，在代码块结束后通常仍可访问。

<!--v-->

## 作用域

**演示**：Notebook 示例 3.3.1

```py []
which_li_hua = "高考英语卷中"

def shanghaitech():
    which_li_hua = "上海科技大学"
    print("上科大的", which_li_hua)

def sustech(): # 假设隔壁大学没有李华
     # 隔壁大学人的第一反应肯定是高考英语卷中的李华
    print("隔壁大学", which_li_hua)

# 外面的人（最外层）没有听说过别的李华
print("外面的人", which_li_hua)
shanghaitech()
sustech()

# shanghaitech 的李华不会影响外面的人心中的李华
print("外面的人", which_li_hua)
```

## `help()`

**这是什么？**

- `help()` 可以查看某函数或对象的帮助
- 在 Python 交互式环境中输入 `help(x)`，可以查看关于 `x` 的帮助
  - 如果 `x` 是函数那么则是对于这个函数的帮助
  - 如果 `x` 是某个类型的字面值 / 变量，那么则是对于这个类型的帮助

</br>

<!--v-->

在 Lec5 项目终端运行 `uv run python` 进入交互式解释器后：

```py
>>> help(print)
Help on built-in function print in module builtins:
print(*args, sep=' ', end='\n', file=None, flush=False)
    Prints the values to a stream, or to sys.stdout by default.
    sep
      string inserted between values, default a space.
    end
      string appended after the last value, default a newline.
    file
      a file-like object (stream); defaults to the current sys.stdout.
    flush
      whether to forcibly flush the stream.
~
(END)
```

- 可以用方向键翻页，按 `q` 退出

## \[非课程内容\] 终端分页器

- Python 的 `help()` 会根据运行环境选择合适的输出方式
- 在许多 Linux/macOS 终端中，长帮助可能交给 `less` 等分页器展示
- 在很久以前，计算机里只有 `vi` 编辑器，它规定的 `:q` 退出， `J/K` 用来上下翻页，`Ctrl+U/D` 快速上下翻页。而这成为了当时的习惯，被沿用下来。
- 当时 `less` 的作者 Mark Nudelman 只是想“方便的翻阅长长的报错”
  - 他当时用的 `vi` 版本不能打开这么大的日志文件
  - 另一个叫 `more` 的工具虽然能打开，但是不能向回翻<small>（现在似乎有了）</small>
- `less` = `vi` 的操作模式 + `more` 的文件支持 的“查看器” （文件分页器）
- Windows、IDE 和 Notebook 中的显示方式可能不同，以当前界面为准

## \[非课程内容\] 代码提示：Pylance 语法分析

- 将鼠标悬浮在 `print` 上，会弹出来一个小提示，会简单告诉你用法

```py
(function) # 告诉我们 `print` 是一个函数
def print(
    *values: object,
    sep: str | None = " ",
    end: str | None = "\n",
    file: SupportsWrite[str] | None = None,
    flush: Literal[False] = False
) -> None: ...
```

- 除了鼠标悬浮，在你一边输入 `print(...)` 的时候，代码提示也会出现
